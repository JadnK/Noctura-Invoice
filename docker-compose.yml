# Entwicklungs-Stack. Fuer Produktion zusaetzlich docker-compose.prod.yml verwenden:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Es gibt keine Standardpasswoerter. Ohne ausgefuellte .env startet nichts.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-noctura}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt: ["no-new-privileges:true"]

  license-api:
    build:
      context: ./apps/license-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-noctura}?schema=public
      REDIS_URL: redis://redis:6379
      LICENSE_KEY_PEPPER: ${LICENSE_KEY_PEPPER:?LICENSE_KEY_PEPPER fehlt in .env}
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:?IP_HASH_PEPPER fehlt in .env}
      SIGNING_PRIVATE_KEY_FILE: /data/secrets/license-signing.key
      SIGNING_PUBLIC_KEY_FILE: /data/secrets/license-signing.pub
      ADMIN_TOKEN_FILE: /data/secrets/admin-access-token
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://rechnungsapp.jadenk.de}
      API_BASE_PATH: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3000
    # Migrationen und Erstinitialisierung laufen vor dem Server, im selben Container.
    command: ["sh", "-c", "npx prisma migrate deploy && node --experimental-strip-types scripts/bootstrap.ts && node --experimental-strip-types src/server.ts"]
    volumes:
      - license-secrets:/data/secrets
    ports:
      - "127.0.0.1:3000:3000"
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]

  admin-web:
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      license-api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://license-api:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://rechnungsapp.jadenk.de}
    ports:
      - "127.0.0.1:3001:3000"
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres-data:
  license-secrets:
