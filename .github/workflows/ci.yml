name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Prisma-Client generieren
        run: npx prisma generate --schema apps/license-api/prisma/schema.prisma
      - run: npm run typecheck
      - name: Tests aller Pakete
        run: npm test
      - name: Keine Fliesskommazahlen in der Geldarithmetik
        run: |
          if grep -rnE 'parseFloat|Number\(.*\)\s*\*\s*0\.' packages/invoice-core/src; then
            echo "::error::Fliesskomma in der Geldarithmetik gefunden (ADR-0001)."; exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Systemabhaengigkeiten fuer Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev unzip
      - name: Eingebettete PDF-Schriften laden
        run: bash apps/desktop/scripts/fetch-fonts.sh
      - name: Rust-Formatierung pruefen
        run: cargo fmt --all --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust-Tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Platzhalter im Signaturschluessel pruefen
        run: |
          if grep -q "PLATZHALTER" apps/desktop/src-tauri/keys/license-signing.pub; then
            echo "::warning::Signaturschluessel ist noch ein Platzhalter — kein Release-Build moeglich."
          fi
      - name: Keine .env im Repository
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env darf nicht eingecheckt werden."; exit 1
          fi
