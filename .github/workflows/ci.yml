name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # Kein "cache: npm", solange kein package-lock.json im Repository liegt.
      # Sobald eines eingecheckt ist (siehe README, Abschnitt "Bauen"), hier
      # "cache: 'npm'" wieder ergaenzen und auf "npm ci" unten umstellen.
      - run: npm install
      - run: npm run typecheck
      - name: Tests aller Pakete
        run: npm test
      - name: Keine Fliesskommazahlen in der Geldarithmetik
        run: |
          if grep -rnE 'parseFloat|Number\(.*\)\s*\*\s*0\.' packages/invoice-core/src; then
            echo "::error::Fliesskomma in der Geldarithmetik gefunden (ADR-0001)."; exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - name: Systemabhaengigkeiten fuer Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Formatierung pruefen (ohne Abhaengigkeitsaufloesung)
        # "cargo fmt --check" ruft intern "cargo metadata" auf und loest dabei
        # den gesamten Abhaengigkeitsbaum auf. Eine einzelne unklare Version in
        # der Cargo.toml wuerde dann schon die reine Formatpruefung zum
        # Absturz bringen. rustfmt direkt auf die Dateien angewendet braucht
        # keine Aufloesung und prueft trotzdem exakt dasselbe.
        run: |
          find apps/desktop/src-tauri/src -name '*.rs' -print0             | xargs -0 rustfmt --check --edition 2021
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ein Release darf nicht mit dem Platzhalter-Signaturschluessel gebaut werden.
      - name: Platzhalter im Signaturschluessel pruefen
        run: |
          if grep -q "PLATZHALTER" apps/desktop/src-tauri/keys/license-signing.pub; then
            echo "::warning::Signaturschluessel ist noch ein Platzhalter — kein Release-Build moeglich."
          fi
      - name: Keine .env im Repository
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env darf nicht eingecheckt werden."; exit 1
          fi
