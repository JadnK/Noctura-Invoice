# Alternative zu Caddy. Zertifikate werden hier nicht verwaltet;
# certbot oder ein vorgelagerter Terminator sind Voraussetzung.

upstream noctura_api   { server license-api:3000; }
upstream noctura_admin { server admin-web:3000; }

server {
    listen 443 ssl http2;
    server_name rechnungsapp.jadenk.de;

    ssl_certificate     /etc/letsencrypt/live/rechnungsapp.jadenk.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rechnungsapp.jadenk.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    client_max_body_size 256k;

    location /api/ {
        proxy_pass http://noctura_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health { proxy_pass http://noctura_api/health; access_log off; }

    location / {
        proxy_pass http://noctura_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name rechnungsapp.jadenk.de;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Nginx Proxy Manager (Web-Oberflaeche statt Rohkonfiguration)
#
# NPM erzeugt aus dem Hauptformular ein einzelnes Ziel (location /) und kann
# keine Pfadaufteilung ueber die Grundeinstellungen abbilden. Zwei Wege:
#
# 1. Falls die eigene NPM-Version "Custom Locations" anbietet:
#    - Details-Tab: Forward Hostname/IP = 127.0.0.1, Forward Port = 3001
#      (admin-web, wird zum Fallback fuer alles ausser /api)
#    - Custom Location: /api -> 127.0.0.1:4219 (license-api)
#
# 2. Sonst im Advanced-Tab unter "Custom Nginx Configuration" einfuegen,
#    bei Forward Hostname/Port weiterhin admin-web (127.0.0.1:3001) als
#    Standardziel:
#
#      location /api/ {
#          proxy_pass http://127.0.0.1:4219/api/;
#          proxy_set_header Host $host;
#          proxy_set_header X-Real-IP $remote_addr;
#          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#          proxy_set_header X-Forwarded-Proto $scheme;
#      }
#
# Die Portnummern (3001 fuer admin-web, 4219 fuer license-api) sind die
# auf dem Host gebundenen Ports aus docker-compose.yml - nicht die
# Docker-internen Servicenamen, die in der obigen Rohkonfiguration stehen.
# NPM muss den Host direkt erreichen koennen (127.0.0.1), nicht das
# Docker-Compose-eigene Netzwerk kennen.
